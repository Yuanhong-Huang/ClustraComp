# ClustraComp 自动测试配置文件
# 格式: KEY=VALUE（等号前后不要加空格）
# 以 # 开头的行为注释，空行会被忽略

# 数据目录（存放待测试文件的目录）
DATA_DIR=./data

# 输出目录（存放测试日志的目录）
OUTPUT_DIR=./logs

# 块大小（字节，必须为正整数）
CHUNK_SIZE=8192

# 可执行文件路径
EXECUTABLE=./ClustraComp

# 特征提取阶段绑定的 CPU 核心编号（-1 表示不绑定）
FEATURE_CORE=-1

# 聚类分组阶段绑定的 CPU 核心编号（-1 表示不绑定）
GROUP_CORE=-1
